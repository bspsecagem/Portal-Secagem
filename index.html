<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal de Coordenação - Secagem</title>
    <style>
        :root {
            --primary: #0284c7;
            --success: #16a34a;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        header {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        h1 { margin: 0 0 5px 0; font-size: 1.4rem; color: var(--primary); }
        .subtitle { margin: 0; font-size: 0.85rem; color: var(--text-muted); }

        .grid-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .card-link {
            background: var(--card-bg);
            padding: 25px 15px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.04);
            text-decoration: none;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            border: 1px solid var(--border);
        }
        .card-link:active, .card-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
            border-color: var(--primary);
        }
        .icon {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        .title-card {
            font-weight: bold;
            font-size: 0.95rem;
            color: var(--text-main);
        }
        .desc-card {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: center;
        }
        footer {
            margin-top: 25px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Painel de Coordenação</h1>
        <p class="subtitle">Setor de Secagem • Acesso Rápido a Indicadores</p>
    </header>

            <span class="icon">🔔</span>
            <span class="title-card">Sempre Alerta</span>
            <span class="desc-card">Acompanhamento e Lançamentos</span>
        </a>

       <!-- Ícone 2: Nova Ferramenta / Matricula/Workday -->
<a href="https://script.google.com/macros/s/AKfycby_xXjARC2jM1KFPR_XTJeq8IiDgtwCezinqdzFcnhgb8J5F1ubF6riO6sEaofLh8aO/exec" target="_blank" class="card-link">
    <span class="icon">📊</span>
    <span class="title-card">Matricula/Workday/ Outro Sistema</span>
    <span class="desc-card">Gestão e Dados</span>
</a>

        <!-- Ícone 3: Planilha Base -->
        <a href="COLOQUE_AQUI_O_LINK_DA_SUA_PLANILHA_SHEETS" target="_blank" class="card-link">
            <span class="icon">📑</span>
            <span class="title-card">Planilha Base</span>
            <span class="desc-card">Visualização em Tabela</span>
        </a>

        <!-- Ícone 4: Treinamentos -->
        <a href="#" target="_blank" class="card-link">
            <span class="icon">🛠️</span>
            <span class="title-card">Treinamentos</span>
            <span class="desc-card">Manuais e Padrões (MPO)</span>
        </a>
    </div>

    <footer>
        Bracell • Indústria de Celulose e Papel

</div>

</body>
</html>
